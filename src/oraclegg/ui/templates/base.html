<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OracleGG{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        oracle: {
                            bg: '#0a0e14',
                            card: '#131920',
                            border: '#1e2a36',
                            accent: '#c89b3c',
                            gold: '#c89b3c',
                            blue: '#0ac8b9',
                            red: '#e84057',
                            green: '#28c76f',
                            purple: '#9b59b6',
                            text: '#a09b8c',
                            light: '#f0e6d2',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #0a0e14; font-family: 'Segoe UI', system-ui, sans-serif; }
        .glow { box-shadow: 0 0 20px rgba(200, 155, 60, 0.15); }
        .card-hover:hover { border-color: #c89b3c; transition: border-color 0.2s; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .htmx-indicator { display: none; }
        .htmx-request .htmx-indicator { display: inline-block; }
        .htmx-request.htmx-indicator { display: inline-block; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #131920; }
        ::-webkit-scrollbar-thumb { background: #1e2a36; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #c89b3c; }
    </style>
</head>
<body class="text-oracle-text min-h-screen">
    <!-- Nav -->
    <nav class="border-b border-oracle-border bg-oracle-card/80 backdrop-blur-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
            <a href="/" class="flex items-center gap-2">
                <span class="text-oracle-gold font-bold text-xl tracking-wide">ORACLE</span>
                <span class="text-oracle-blue font-light text-xl">.GG</span>
            </a>
            <div class="flex items-center gap-6 text-sm">
                <a href="/" class="hover:text-oracle-light transition-colors {% block nav_dashboard %}{% endblock %}">Dashboard</a>
                <a href="/champ-select" class="hover:text-oracle-light transition-colors {% block nav_champ_select %}{% endblock %}">Champ Select</a>
                <a href="/in-game" class="hover:text-oracle-light transition-colors {% block nav_in_game %}{% endblock %}">In-Game</a>
                <a href="/tracking" class="hover:text-oracle-light transition-colors {% block nav_tracking %}{% endblock %}">Tracking</a>
                <a href="/settings" class="hover:text-oracle-light transition-colors {% block nav_settings %}{% endblock %}">Settings</a>
                <!-- Live match indicator -->
                <a href="/in-game" id="live-indicator" style="display:none"
                   class="flex items-center gap-1.5 bg-oracle-red/20 border border-oracle-red/40 text-oracle-red px-3 py-1 rounded-full text-xs font-bold ml-2 animate-pulse">
                    <span class="w-2 h-2 rounded-full bg-oracle-red"></span>
                    LIVE
                </a>
            </div>
        </div>
    </nav>

    <!-- Update banner -->
    <div id="update-banner" style="display:none" class="bg-oracle-gold/10 border-b border-oracle-gold/30 px-4 py-2">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <span class="text-oracle-gold text-sm">
                New version <strong id="update-version"></strong> available!
            </span>
            <div class="flex gap-2">
                <button onclick="applyUpdate()" id="update-btn"
                        class="bg-oracle-gold/20 border border-oracle-gold text-oracle-gold px-3 py-1 rounded text-xs hover:bg-oracle-gold/30">
                    Update Now
                </button>
                <button onclick="document.getElementById('update-banner').style.display='none'"
                        class="text-oracle-text/40 text-xs hover:text-oracle-text">Dismiss</button>
            </div>
        </div>
    </div>

    <!-- Main content -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>

    <script>
    // ─── Global State Machine ────────────────────────────────────────
    // Handles auto-navigation from ANY page based on game phase.
    // Individual pages opt out by setting window._oracleNoAutoNav = true.

    let _lastPhase = null;
    let _postGameTimer = null;

    function _getCurrentPage() {
        const path = window.location.pathname;
        if (path === '/in-game') return 'in-game';
        if (path === '/tracking') return 'tracking';
        if (path === '/champ-select') return 'champ-select';
        if (path === '/settings') return 'settings';
        return 'dashboard';
    }

    function _globalStateCheck() {
        fetch('/api/game-state').then(r=>r.json()).then(s => {
            const phase = s.phase;
            const page = _getCurrentPage();
            const el = document.getElementById('live-indicator');

            // Update live indicator
            if (el) el.style.display = phase === 'in_game' ? 'flex' : 'none';

            // Check auto_redirect setting
            let autoRedirect = true;
            try {
                const prefs = JSON.parse(localStorage.getItem('oraclegg_settings'));
                if (prefs && prefs.auto_redirect === false) autoRedirect = false;
            } catch {}

            // Skip if page opts out
            if (window._oracleNoAutoNav) {
                _lastPhase = phase;
                return;
            }

            if (autoRedirect) {
                // Game started → go to in-game (from any page)
                if (phase === 'in_game' && page !== 'in-game') {
                    window.location.href = '/in-game';
                    return;
                }

                // Game ended → stay on in-game page to show post-game summary
                // User clicks "View Analysis" when ready
                if (phase === 'post_game' && _lastPhase === 'in_game' && page === 'in-game') {
                    // Don't redirect — post-game summary shows on the in-game page
                }

                // Back to idle after post-game (clear timer)
                if (phase === 'idle' && _lastPhase === 'post_game') {
                    if (_postGameTimer) { clearTimeout(_postGameTimer); _postGameTimer = null; }
                }
            }

            _lastPhase = phase;
        }).catch(()=>{});
    }

    _globalStateCheck();
    setInterval(_globalStateCheck, 3000);

    // ─── Updates ─────────────────────────────────────────────────────
    fetch('/api/update/check').then(r=>r.json()).then(d=>{
        if(d.available && d.url){
            document.getElementById('update-version').textContent = d.version;
            document.getElementById('update-banner').style.display = 'block';
            window._updateUrl = d.url;
        }
    }).catch(()=>{});

    async function applyUpdate(){
        if(!window._updateUrl) return;
        const btn = document.getElementById('update-btn');
        btn.textContent = 'Updating...';
        btn.disabled = true;
        try {
            const r = await fetch('/api/update/apply', {
                method:'POST',
                headers:{'Content-Type':'application/json'},
                body: JSON.stringify({url: window._updateUrl})
            });
            const d = await r.json();
            if(d.ok){
                btn.textContent = 'Restarting...';
                setTimeout(()=>location.reload(), 3000);
            } else {
                btn.textContent = 'Failed';
            }
        } catch {
            btn.textContent = 'Failed';
        }
    }
    </script>

    {% block scripts %}{% endblock %}
</body>
</html>
